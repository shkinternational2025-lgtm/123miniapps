# ============================================================
# 123MiniApps.online — production Nginx server config
# Place at: /etc/nginx/sites-available/123miniapps.online
# then: ln -s ../sites-available/123miniapps.online /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# Assumes the site files live in:  /var/www/123miniapps
# Get HTTPS certs first with:       certbot --nginx -d 123miniapps.online -d www.123miniapps.online
# (Certbot will fill in the ssl_certificate lines automatically.)
# ============================================================

# ---- 1. HTTP -> HTTPS (both hosts) ----
server {
    listen 80;
    listen [::]:80;
    server_name 123miniapps.online www.123miniapps.online;
    # Allow ACME challenge for certbot renewals
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.123miniapps.online$request_uri; }
}

# ---- 2. non-www HTTPS -> www HTTPS (canonical is www) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 123miniapps.online;

    ssl_certificate     /etc/letsencrypt/live/123miniapps.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123miniapps.online/privkey.pem;

    return 301 https://www.123miniapps.online$request_uri;
}

# ---- 3. Main site (www, HTTPS) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.123miniapps.online;

    root /var/www/123miniapps;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/123miniapps.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123miniapps.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # -------- Security headers --------
    # HSTS: force HTTPS for 1 year (only add once you are sure HTTPS works).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # -------- Content-Security-Policy --------
    # BASE policy (ads OFF). Allows the site's own code + Google Fonts only.
    # 'unsafe-inline' is required because pages use small inline <script> (year,
    # JSON-LD) and the inline font-load onload handler; the site loads NO
    # third-party scripts, so the real attack surface is tiny.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://plausible.io https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    #
    # When you TURN ON Adsterra, comment the line above and use this instead
    # (Adsterra serves from rotating hosts, so its script/frame sources are broad):
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https: ; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # -------- Compression --------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;
    # If ngx_brotli is installed, prefer it:
    # brotli on; brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # -------- Caching --------
    # Versioned assets (?v=x.y.z) are safe to cache hard and long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json     { add_header Cache-Control "public, max-age=86400"; }

    # HTML: let browsers revalidate so content updates show up promptly.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # -------- Do not serve build/source files --------
    location ~* \.(py|md|sh|bat|ps1|map|log)$ { deny all; }
    location ^~ /test/  { deny all; }
    location ^~ /admin/ { deny all; }           # blog editor is a local dev tool
    location = /theme-debug.html { deny all; }
    location = /tools/_template.html { deny all; }

    # -------- Friendly 404 --------
    error_page 404 /404.html;

    # -------- Default file serving --------
    location / {
        try_files $uri $uri/ =404;
    }
}

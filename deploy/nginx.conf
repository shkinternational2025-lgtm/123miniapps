# 123MiniApps — container nginx config (served behind Traefik).
# Traefik terminates TLS and redirects HTTP->HTTPS, so this only serves plain
# HTTP on port 80 inside the container. Security headers, gzip, caching and
# source-file protection live here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- One canonical host: send the bare domain to www (301) ----
    # Traefik passes the original Host header through, so this catches
    # https://123miniapps.online/... and sends it to the www version.
    if ($host = "123miniapps.online") {
        return 301 https://www.123miniapps.online$request_uri;
    }

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ---- Compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    # ---- Do not serve source / build files ----
    location ~* \.(py|pyc|md|sh|bat|ps1|log|conf|yml|yaml|docx|xlsx)$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }   # .git, .gitignore, other dotfiles
    location ^~ /deploy/      { deny all; }
    location ^~ /__pycache__/ { deny all; }
    location ^~ /_indexing/   { deny all; }
    location ^~ /test/  { deny all; }
    location ^~ /admin/ { deny all; }
    location ^~ /.git/  { deny all; }
    location = /theme-debug.html      { deny all; }
    location = /tools/_template.html  { deny all; }

    # ---- Caching ----
    location = /service-worker.js { expires -1; add_header Cache-Control "no-cache"; }

    # ---- Ad iframe documents ----
    # Adsterra's invoke.js builds the banner with eval(), which needs
    # 'unsafe-eval'. We allow it ONLY for the /assets/ads/ folder (the
    # sandboxed, same-origin ad frames) so the rest of the site keeps the
    # stricter policy. A location add_header cancels inheritance of the
    # server-level headers, so the security headers are re-declared here.
    location ^~ /assets/ads/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    location /assets/ { expires 30d; }

    # ---- Friendly 404 ----
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
